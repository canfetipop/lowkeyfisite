media:
  input: public/images/uploads
  output: /images/uploads
  categories: [image]
  extensions: [png, jpg, jpeg, webp, gif]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user

content:
  - name: settings
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - { name: windowTitle, label: Window title, type: string, required: true }
      - name: theme
        label: Theme
        type: object
        fields:
          - { name: accentColor, label: Main blue color, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Use a hex color such as #001d8f." } }
          - { name: accentColorLight, label: Lighter blue color, type: string, required: true, pattern: "^#[0-9a-fA-F]{6}$" }
          - { name: windowColor, label: Window color, type: string, required: true, pattern: "^#[0-9a-fA-F]{6}$" }
          - { name: pageBackground, label: Outside background, type: string, required: true, pattern: "^#[0-9a-fA-F]{6}$" }
          - name: cornerStyle
            label: Corner style
            type: select
            required: true
            options:
              values:
                - { name: rounded, label: Rounded }
                - { name: square, label: Classic square }

  - name: navigation
    label: Sidebar navigation
    type: file
    path: src/content/navigation.json
    format: json
    list: true
    operations: { delete: false }
    fields:
      - { name: id, label: Page ID, type: string, required: true, readonly: true }
      - { name: label, label: Sidebar label, type: string, required: true }
      - { name: icon, label: Sidebar icon, type: image, required: true }

  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home
        type: file
        path: src/content/home.json
        format: json
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: description, label: Introduction, type: text, required: true }
          - { name: heroImage, label: Hero image, type: image, required: true }
          - { name: heroImageAlt, label: Hero image description, type: string, required: true }
          - name: currentStatus
            label: Current status
            type: object
            list: { min: 1, max: 3, collapsible: { collapsed: true, summary: "{label} {value}" } }
            fields:
              - { name: id, label: ID, type: string, required: true }
              - { name: label, label: Label, type: string, required: true }
              - { name: value, label: Value, type: string, required: true }
              - { name: icon, label: Icon, type: image, required: true }

      - name: about
        label: About
        type: file
        path: src/content/about.json
        format: json
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: image, label: Main image, type: image, required: true }
          - { name: imageAlt, label: Image description, type: string, required: true }
          - { name: paragraphs, label: Paragraphs, type: text, list: true, required: true }

      - name: postCategories
        label: Post category cards
        type: file
        path: src/content/post-categories.json
        format: json
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: intro, label: Introduction, type: text, required: true }
          - name: categories
            label: Categories
            type: object
            list: { min: 1, collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: id, label: ID, type: string, required: true, pattern: "^[a-z0-9-]+$" }
              - { name: title, label: Title, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: icon, label: Icon, type: image, required: true }

      - name: resources
        label: Resources
        type: file
        path: src/content/resources.json
        format: json
        fields:
          - { name: heading, label: Page title, type: string, required: true, readonly: true }
          - name: sections
            label: Resource content
            type: block
            required: true
            list: { min: 1, collapsible: { collapsed: true, summary: "{text}" } }
            description: "Add and reorder blue headings, paragraphs, and pictures."
            blocks:
              - name: heading
                label: Blue heading
                type: object
                fields:
                  - { name: text, label: Heading, type: string, required: true }
              - name: paragraph
                label: Paragraph
                type: object
                fields:
                  - { name: text, label: Text, type: text, required: true, description: "Blank lines create separate paragraphs." }
              - name: image
                label: Picture
                type: object
                fields:
                  - { name: image, label: Picture, type: image, required: true }

      - name: contact
        label: Contact
        type: file
        path: src/content/contact.json
        format: json
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: intro, label: Introduction, type: string, required: true }
          - name: links
            label: Contact links
            type: object
            list: { min: 1, collapsible: { collapsed: true, summary: "{label}" } }
            fields:
              - { name: id, label: ID, type: string, required: true, pattern: "^[a-z0-9-]+$" }
              - { name: label, label: Label, type: string, required: true }
              - { name: handle, label: Display text, type: string, required: true }
              - { name: url, label: Link URL, type: string, required: true }
              - { name: icon, label: Icon, type: image, required: true }
              - { name: openInNewTab, label: Open in a new tab, type: boolean }
          - name: support
            label: Support card
            type: object
            fields:
              - { name: enabled, label: Show support card, type: boolean }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: image, label: Image, type: image, required: true }
              - { name: imageAlt, label: Image description, type: string, required: true }
              - { name: buttonLabel, label: Button label, type: string, required: true }
              - { name: url, label: Support URL, type: string, required: true }

  - name: postsByCategory
    label: Posts by category
    type: group
    items:
      - name: moneyPosts
        label: Money posts
        type: collection
        path: src/content/posts/money
        format: json
        filename: "{fields.slug}.json"
        view: &post_view
          primary: title
          fields: [title, date, published, featured]
          sort: [date, title]
          search: [title, excerpt]
          default: { sort: date, order: desc }
        fields: &post_fields
          - { name: title, label: Title, type: string, required: true }
          - name: slug
            label: URL-friendly ID
            type: string
            required: true
            description: "Lowercase letters, numbers, and hyphens only."
            pattern: { regex: "^[a-z0-9-]+$", message: "Use lowercase letters, numbers, and hyphens only." }
          - { name: published, label: Published, type: boolean }
          - { name: featured, label: Feature on homepage, type: boolean }
          - { name: date, label: Publish date, type: date, required: true }
          - { name: excerpt, label: Subtitle, type: text, required: true }
          - { name: image, label: Homepage/card picture, type: image, description: "Optional. The full picture is shown without cropping." }
          - name: sections
            label: Post content
            type: block
            required: true
            list: { min: 1, collapsible: { collapsed: true, summary: "{text}" } }
            description: "Add paragraphs and pictures in the exact order they should appear."
            blocks:
              - name: heading
                label: Blue heading
                type: object
                fields:
                  - { name: text, label: Heading, type: string, required: true }
              - name: paragraph
                label: Paragraph
                type: object
                fields:
                  - { name: text, label: Text, type: text, required: true, description: "Blank lines create separate paragraphs." }
              - name: image
                label: Picture
                type: object
                fields:
                  - { name: image, label: Picture, type: image, required: true }

      - name: exploringPosts
        label: Exploring posts
        type: collection
        path: src/content/posts/exploring
        format: json
        filename: "{fields.slug}.json"
        view: *post_view
        fields: *post_fields

      - name: travelPosts
        label: Travel posts
        type: collection
        path: src/content/posts/travel
        format: json
        filename: "{fields.slug}.json"
        view: *post_view
        fields: *post_fields

      - name: guidePosts
        label: Guide posts
        type: collection
        path: src/content/posts/guides
        format: json
        filename: "{fields.slug}.json"
        view: *post_view
        fields: *post_fields
